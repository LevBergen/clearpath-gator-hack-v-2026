services:
  - type: web
    name: clearpath
    runtime: node
    plan: free
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/status
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: GEMINI_MODEL
        value: gemma-4-26b-a4b-it
      - key: GEMINI_API_KEY
        sync: false
